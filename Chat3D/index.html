<title>会話ビュー</title>
<style>

*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans JP','Yu Gothic UI',sans-serif}body{overflow:hidden}.scroll{height:100%;overflow:auto}.diagram{min-width:390px;min-height:100%;position:relative}.diagram:before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent calc(16.6667% - .5px),var(--border) calc(16.6667% - .5px),var(--border) calc(16.6667% + .5px),transparent calc(16.6667% + .5px),transparent calc(50% - .5px),var(--border) calc(50% - .5px),var(--border) calc(50% + .5px),transparent calc(50% + .5px),transparent calc(83.3333% - .5px),var(--border) calc(83.3333% - .5px),var(--border) calc(83.3333% + .5px),transparent calc(83.3333% + .5px))}.actors{position:sticky;top:0;z-index:2;background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);padding:12px 0 10px;border-bottom:1px solid var(--border);text-align:center}.actor{font-size:13px;font-weight:650}.actor.user{color:var(--user)}.actor.llm{color:var(--llm)}.actor.pc{color:var(--pc)}.events{position:relative;padding:8px 0 32px}.event{position:relative;padding:4px 0 8px;min-height:84px}.event-button{position:relative;display:block;margin:0 auto;width:calc(100% - 28px);max-width:720px;background:transparent;border:0;padding:2px 0 20px;color:var(--text);font:inherit;text-align:left;cursor:pointer}.event-button:focus-visible{outline:2px solid var(--user);outline-offset:2px;border-radius:6px}.message{display:block;position:relative;z-index:1;width:46%;margin-left:27%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-width:0}.event-button:hover .message{background:var(--hover)}.event-button[aria-expanded=true] .message{background:var(--selected)}.meta{display:block;color:var(--accent);font-size:11px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview{display:block;margin-top:4px;color:var(--text);font-size:12px;line- .workspace{grid-template-columns:minmax(0,var(--diagram-width,60%)) 7px minmax(0,1fr)}.detail-panel{border-left:0}.divider{cursor:ew-resize;touch-action:none;background:var(--border);border-inline:3px solid var(--bg)}.divider:hover,.divider:focus-visible{background:var(--user);outline:none}.message{border-left:3px solid var(--accent)}.event-button[aria-pressed=true] .message{border-color:var(--border);border-left-color:var(--accent)}.arrow{height:2px}.arrow:after{top:-4px;border-top-width:5px;border-bottom-width:5px;border-left-width:8px}.event.llm-user .arrow:after,.event.pc-llm .arrow:after{border-right-width:8px}
.event.user-llm .arrow,.event.llm-user .arrow{left:16.6667%;width:66.6666%}.event.llm-pc .arrow,.event.pc-llm .arrow{left:50%;width:33.3333%}.event.user-llm .message,.event.llm-user .message{width:50%;margin-left:25%}.arrow:after,.event.llm-user .arrow:after,.event.pc-llm .arrow:after{content:'';position:absolute;top:-4px;width:8px;height:10px;border:0;background:var(--accent);left:auto;right:0;clip-path:polygon(0 0,100% 50%,0 100%)}.event.llm-user .arrow:after,.event.llm-pc .arrow:after{left:0;right:auto;clip-path:polygon(100% 0,0 50%,100% 100%)}
